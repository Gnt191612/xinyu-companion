<style>
:root{color-scheme:light;--ink:#453c53;--muted:#8e8097;--pink:#d282a4;--line:#e9dce7}*{box-sizing:border-box}body{margin:0;font:15px/1.75 "Microsoft YaHei",sans-serif;color:var(--ink);background:#f4eff5;background-image:radial-gradient(ellipse at 90% 0,#e4eeea88,transparent 48%),radial-gradient(ellipse at 8% 95%,#f8dbe7,transparent 50%)}button,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.5}.shell{width:min(1360px,calc(100% - 64px));height:calc(100dvh - 64px);min-height:580px;margin:32px auto;display:grid;grid-template-columns:35% 65%;border:1px solid #fff;border-radius:28px;overflow:hidden;box-shadow:0 24px 85px #7858791d}.portrait{position:relative;background:url('/assets/xinyu-sakura.png') center 27%/cover}.portrait:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#35233d0d 20%,transparent 45%,#30283a96 100%)}.brand{position:absolute;top:28px;left:28px;z-index:1;color:white;font-size:13px;letter-spacing:3px;text-shadow:0 1px 10px #634675}.intro{position:absolute;bottom:34px;left:32px;right:28px;z-index:1;color:white}.intro small{font-size:12px;letter-spacing:4px;opacity:.85}.intro h1{font-family:"STSong","SimSun",serif;font-size:48px;font-weight:400;letter-spacing:8px;line-height:1.3;margin:12px 0}.intro p{font-size:14px;line-height:2;opacity:.95;margin:0;max-width:320px}.badge{display:inline-flex;gap:7px;align-items:center;margin-top:22px;padding:7px 12px;border-radius:30px;background:#ffffff20;border:1px solid #ffffff40;font-size:11px;backdrop-filter:blur(10px)}.badge i{height:7px;width:7px;background:#9cddc5;border-radius:50%}.chat{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:#fffafce8}.chat:before{content:"";position:absolute;inset:0;background:url('/assets/xinyu-sakura.png') 55% 40%/cover;opacity:.035;pointer-events:none}.top{position:relative;display:flex;align-items:center;padding:22px 32px;border-bottom:1px solid var(--line);gap:13px;background:#ffffff8c}.avatar{width:46px;height:46px;border-radius:50%;background:url('/assets/xinyu-sakura.png') 50% 23%/260%;border:2px solid white;box-shadow:0 3px 12px #c6a2b84d;flex:none}.name{font-size:18px;font-weight:600;letter-spacing:2px}.presence{font-size:11px;color:var(--muted)}.presence:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#8bb9a5;margin-right:6px}.reset{margin-left:auto;border:1px solid #e7dae4;background:#fff8;color:#8a7289;border-radius:20px;padding:6px 13px;font-size:12px}.messages{position:relative;flex:1;overflow:auto;min-height:0;padding:32px;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#e7d2df transparent}.welcome{height:100%;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.flower{font-size:30px;color:#d39db7}.welcome h2{font-family:"STSong","SimSun",serif;font-size:27px;letter-spacing:2px;font-weight:400;margin:16px 0 8px}.welcome p{color:var(--muted);font-size:13px;margin:0;line-height:2}.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:25px}.suggestions button{border:1px solid #ebdce5;color:#8a7188;background:#fffc;padding:8px 15px;border-radius:22px;font-size:12px;transition:.2s}.suggestions button:hover{background:#f8e7ef;border-color:#dcb5c9}.row{display:flex;align-items:flex-start;gap:10px;margin:0 0 24px}.row.user{justify-content:flex-end}.row .avatar{width:30px;height:30px;margin-top:4px}.bubble{max-width:85%;background:white;border:1px solid #efe4ed;border-radius:4px 18px 18px 18px;padding:14px 19px;box-shadow:0 4px 14px #9b779c06;white-space:pre-wrap;word-break:break-word;line-height:1.9}.user .bubble{background:#f4e5ee;border-color:#efdae7;border-radius:18px 4px 18px 18px}.info{font-size:11px;color:#a391a6;margin:7px 0 0 4px}.thinking{color:#a5839b;font-size:13px;padding:12px 0}.dots{display:inline-flex;gap:4px;margin-left:7px}.dots i{width:4px;height:4px;background:#c59ab2;border-radius:50%;animation:breathe 1.2s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}@keyframes breathe{50%{opacity:.25;transform:translateY(-3px)}}.composer{position:relative;padding:18px 32px 20px;background:#fffc;border-top:1px solid var(--line)}.input-wrap{border:1px solid #e5d5e1;border-radius:18px;background:#fff;padding:12px 15px;box-shadow:0 4px 18px #b293af08;transition:.2s}.input-wrap:focus-within{border-color:#c79bb5;box-shadow:0 0 0 3px #e6c8da30}textarea{display:block;width:100%;min-height:55px;max-height:120px;resize:vertical;outline:none;border:0;color:var(--ink);background:transparent;font-size:14px}textarea::placeholder{color:#b2a3b4}.input-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px}.hint{color:#b2a2b0;font-size:10px}.send{display:flex;align-items:center;gap:9px;border:0;background:linear-gradient(135deg,#d69bb9,#b58ab0);color:white;border-radius:12px;padding:7px 17px;font-size:12px}.status{font-size:11px;color:var(--muted);margin-top:9px;min-height:18px}.footer{color:#b4a5b5;font-size:10px;text-align:center;margin-top:7px}details{color:#a18da3;font-size:11px;margin-top:8px}summary{cursor:pointer}.error{color:#ad607e}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:900px){.shell{width:calc(100% - 32px);margin:16px auto;height:calc(100dvh - 32px);grid-template-columns:30% 70%;border-radius:22px}.intro{left:20px;bottom:25px}.intro h1{font-size:34px}.intro p{font-size:12px}.top,.messages{padding:20px}.composer{padding:15px 20px}.brand{left:20px;font-size:10px}.badge{font-size:9px}}@media(max-width:620px){.shell{width:100%;height:100dvh;margin:0;border:0;border-radius:0;min-height:0;display:block}.portrait{display:none}.chat{height:100%;background:#fff9fbea}.chat:before{opacity:.07}.top{padding:15px 18px}.messages{padding:24px 18px}.composer{padding:12px 16px 16px}.welcome h2{font-size:24px}.bubble{max-width:90%;font-size:14px}.hint{font-size:9px}.footer{font-size:9px}.suggestions{gap:7px}}

/* 全景背景贯穿人物区与聊天区，面板只负责保证阅读清晰。 */
body{background:#b59bab url('/assets/scenery.png') center top/cover fixed no-repeat}
.shell{width:100%;height:100dvh;min-height:580px;margin:0;grid-template-columns:38% 62%;border:0;border-radius:0;box-shadow:none;overflow:hidden;background:transparent}
.portrait{background:none}.portrait:after{display:none}.brand{top:32px;left:36px}.intro{left:24px;right:0;bottom:24px;padding:18px 12px;background:linear-gradient(90deg,#382a426b,transparent);border-radius:16px;text-shadow:0 2px 10px #37273ccc}.intro p{max-width:340px}.badge{background:#4b34484d}
.chat{margin:28px 30px 28px 0;border:1px solid #ffffff85;border-radius:26px;overflow:hidden;background:#fffafc70;backdrop-filter:blur(3px);box-shadow:0 12px 45px #49384920}.chat:before{display:none}.top{background:#ffffff38}.composer{background:#fffafc42}.bubble{background:#fffffff0}.welcome p{color:#716276}.welcome h2{color:#45364c}.suggestions button{background:#fff9}
@media(max-width:900px){.shell{width:100%;height:100dvh;margin:0;grid-template-columns:35% 65%;border-radius:0}.chat{margin:16px 16px 16px 0}.intro{left:20px;bottom:30px}.brand{left:20px}}
@media(max-width:620px){body{background-image:url('/assets/sakura-panorama.png');background-position:30% center}.shell{min-height:0;display:block}.chat{height:calc(100dvh - 24px);margin:12px;background:#fffafc88;border-radius:20px}.chat:before{display:none}}
/* 用户消息按整行计算宽度，保留原始换行和长串字符。 */
.row>div:last-child{min-width:0;max-width:85%}.row .bubble{max-width:100%;overflow-wrap:anywhere;word-break:normal}.user>div:last-child{width:fit-content;max-width:85%}.user .bubble{text-align:left}
.scene-character{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.character-art{width:100%;height:100%;object-fit:cover;object-position:center top;transform-origin:22% 60%;animation:character-breathe 4.8s ease-in-out infinite;will-change:transform}.shell{position:relative;z-index:2}.petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}.motion-toggle{border:0;background:transparent;color:#8a7289;font-size:11px;padding:6px;white-space:nowrap}.reset{margin-left:0;white-space:nowrap}.motion-toggle{margin-left:auto}.avatar{transition:filter .4s,transform .4s}body[data-mood="welcoming"] .character-art{animation:character-welcome 1.6s ease-in-out infinite}body[data-mood="listening"] .character-art{animation:character-listen 3s ease-in-out infinite}body[data-mood="replying"] .character-art{animation:character-nod 1.2s ease-in-out}body[data-mood="happy"] .character-art{animation:character-happy 1.4s ease-in-out}body[data-mood="listening"] .avatar{box-shadow:0 0 0 5px #d8b9d34d}body[data-mood="happy"] .avatar{filter:brightness(1.1)}.motion-off .character-art{animation:none!important;will-change:auto}.motion-off .dots i{animation:none}
@keyframes character-welcome{25%{transform:translateY(-14px) rotate(-1.2deg) scale(1.025)}60%{transform:translateY(5px) rotate(.8deg)}85%{transform:translateY(-6px) rotate(-.4deg)}}@keyframes character-breathe{50%{transform:translateY(-12px) scale(1.024)}}@keyframes character-listen{50%{transform:rotate(-.5deg) translateY(-2px)}}@keyframes character-nod{35%{transform:translateY(5px) rotate(.4deg)}70%{transform:translateY(-2px)}}@keyframes character-happy{30%{transform:translateY(-6px) rotate(-.4deg)}65%{transform:translateY(0) rotate(.3deg)}}
@media(max-width:620px){.scene-character{display:none}.top{gap:8px}.top .avatar{width:36px;height:36px}.reset{padding:6px 9px}.motion-toggle{font-size:10px;padding:3px}.row>div:last-child,.user>div:last-child{max-width:90%}}
@media(prefers-reduced-motion:reduce){.character-art,.dots i{animation:none!important}.messages{scroll-behavior:auto}}
.row.failed .bubble{border-color:#b97992}.row.failed button{display:block;margin-top:8px;border:1px solid #b97992;border-radius:10px;background:#fff9;color:#92536b;padding:3px 10px;font-size:12px}
/* 倾听采用独立姿态：耳旁抬手、头部侧倾；原立绘作为待机和轻快回应。 */
.character-art{position:absolute;inset:0;transition:opacity .22s ease}
.listening-art{opacity:0;animation:none;transform-origin:26% 62%}
body:is([data-mood="listening"],[data-mood="welcoming"]):not(.motion-off):not(.pose-unavailable) .character-art:not(.listening-art){opacity:0}
body:is([data-mood="listening"],[data-mood="welcoming"]):not(.motion-off):not(.pose-unavailable) .listening-art{opacity:1;animation:ear-listen 3.6s ease-in-out infinite}
@keyframes ear-listen{0%,100%{transform:translateX(-6%) scale(1.01)}50%{transform:translateX(-4.6%) rotate(1.8deg) scale(1.035)}}
.motion-off .listening-art{opacity:0!important}
@media(prefers-reduced-motion:reduce){.listening-art{opacity:0!important}.character-art:not(.listening-art){opacity:1!important}}
</style></head>
<body data-mood="idle"><div class="scene-character" aria-hidden="true"><img class="character-art" src="/assets/character.png" alt="" onerror="this.style.display='none'"><img class="character-art listening-art" src="/assets/listening.png" alt="" onerror="document.body.classList.add('pose-unavailable')"></div><canvas class="petals" id="petals" aria-hidden="true"></canvas><main class="shell"><aside class="portrait" aria-label="樱花窗边的白发猫娘心语"><div class="brand">心语共鸣 · SAKURA</div><div class="intro"><small>把心事，慢慢说给我听</small><h1>心语</h1><p>不必急着整理好情绪。<br>在这里，开心和不开心，都可以被听见。</p><div class="badge"><i></i>樱花陪伴</div></div></aside>
<section class="chat" aria-label="与心语聊天"><header class="top"><div class="avatar" aria-hidden="true"></div><div><div class="name">心语</div><div class="presence" id="presence">在这里，听你说</div></div><button class="motion-toggle" id="motion-toggle" type="button" aria-pressed="true">✧ 动效开启</button><button class="reset" id="reset" type="button" title="清空当前对话，重新开始20轮聊天">↻ 重新开始</button></header>
<div class="messages" id="messages" role="log" aria-live="polite"></div>
<form class="composer" id="form"><div class="input-wrap"><label class="sr-only" for="input">给心语的消息</label><textarea id="input" rows="2" maxlength="3000" placeholder="今天过得怎么样？想说什么都可以……" required></textarea><div class="input-bottom"><span class="hint"><span id="rounds">0 / 20 轮</span> · Enter 发送 · Shift + Enter 换行</span><button class="send" id="send" type="submit">发送 <span aria-hidden="true">↗</span></button></div></div><div class="status" id="status">悄悄话只留在这一页，刷新后清空。</div></form></section></main>
<script>
let moodTimer;function setMood(mood,duration=0){clearTimeout(moodTimer);document.body.dataset.mood=mood;if(duration)moodTimer=setTimeout(()=>{document.body.dataset.mood='idle';},duration);}
let history=[];let busy=false;const box=document.getElementById('messages'),input=document.getElementById('input'),send=document.getElementById('send'),reset=document.getElementById('reset'),status=document.getElementById('status');
const rounds=document.getElementById('rounds'),MAX_ROUNDS=20;
function updateRounds(){const count=Math.floor(history.length/2);rounds.textContent=count+' / '+MAX_ROUNDS+' 轮';send.disabled=busy||count>=MAX_ROUNDS;input.disabled=count>=MAX_ROUNDS;reset.disabled=busy;if(count>=MAX_ROUNDS)status.textContent='这段聊天已满20轮，点击右上角“重新开始”，我们再慢慢聊。';}
const labels={joy:'喜悦',gratitude:'感激',relaxed:'放松',care:'关心',pride:'自豪',neutral:'平静',surprise:'惊讶',mixed:'复杂情绪',sadness:'难过',loneliness:'孤独',anxiety:'焦虑',anger:'愤怒',fear:'害怕',disgust:'反感',shame:'羞愧',helplessness:'无助'};
function welcome(){box.innerHTML='<div class="welcome"><div class="flower" aria-hidden="true">✿</div><h2>今天，让心事轻一点</h2><p>不用想好怎么开口，慢慢说就好。<br>我会认真听，也陪你一点点理清。</p><div class="suggestions"><button type="button">今天有点累，想聊聊</button><button type="button">有件开心的事想分享</button><button type="button">先陪我待一会儿</button></div></div>';box.querySelectorAll('.suggestions button').forEach(b=>b.onclick=()=>{input.value=b.textContent;input.focus();});}
function add(role,text){box.querySelector('.welcome')?.remove();const row=document.createElement('div');row.className='row '+role;if(role==='assistant'){const avatar=document.createElement('div');avatar.className='avatar';avatar.setAttribute('aria-hidden','true');row.append(avatar);}const content=document.createElement('div');const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;content.append(bubble);row.append(content);box.append(row);box.scrollTop=box.scrollHeight;return {row,content};}
function thinking(){const el=document.createElement('div');el.className='thinking';el.innerHTML='心语在认真听<span class="dots"><i></i><i></i><i></i></span>';box.append(el);box.scrollTop=box.scrollHeight;return el;}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();if(busy||history.length>=MAX_ROUNDS*2)return;const text=input.value.trim();if(!text)return;history.push({role:'user',content:text});const user=add('user',text);input.value='';busy=true;const invited=/(?:聊.{0,5}天|陪.{0,5}聊|想.{0,4}聊)/.test(text);setMood(invited?'welcoming':'listening',1800);document.getElementById('presence').textContent='正在认真听你说';send.disabled=reset.disabled=true;const pending=thinking();status.classList.remove('error');status.textContent='等我一小会儿，正在想怎么回应你……';try{const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({history})});const d=await res.json();if(!res.ok)throw Error(d.error||'本机服务未能完成回复');if(typeof d.response_text!=='string'||!d.response_text.trim())throw Error('本轮回复为空，请重试');pending.remove();history.push({role:'assistant',content:d.response_text});const answer=add('assistant',d.response_text);setMood(!d.emotion_uncertain&&['joy','pride','gratitude','relaxed'].includes(d.emotion_label)?'happy':'replying',1400);const detail=document.createElement('details');const summary=document.createElement('summary');summary.textContent='查看本轮分析';const meta=document.createElement('div');meta.textContent=(d.emotion_uncertain?'情感线索不足，暂不作确定判断':'情感参考：'+(labels[d.emotion_label]||d.emotion_label))+' · '+d.seconds+' 秒 · 画像：'+(Object.values(d.user_profile||{}).flat().join('、')||'暂无充分线索');detail.append(summary,meta);answer.content.append(detail);status.textContent='我在，想说的时候就继续。';box.scrollTop=box.scrollHeight;}catch(err){pending.remove();history.pop();user.row.classList.add('failed');const retry=document.createElement('button');retry.type='button';retry.textContent='未发送 · 重试';retry.onclick=()=>{if(busy)return;user.row.remove();input.value=text;document.getElementById('form').requestSubmit();};user.content.append(retry);status.classList.add('error');status.textContent=err instanceof TypeError?'本机聊天服务未连接，请启动心语后点击重试。':'这条消息未发送成功：'+err.message;}finally{busy=false;document.getElementById('presence').textContent='在这里，听你说';if(status.classList.contains('error'))setMood('idle');updateRounds();if(!input.disabled)input.focus();}};
input.addEventListener('input',()=>{if(!busy)setMood('idle');});
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();document.getElementById('form').requestSubmit();}};
reset.onclick=()=>{if(busy)return;history=[];input.value='';setMood('idle');welcome();status.classList.remove('error');status.textContent='新的悄悄话，从这里开始。此前的对话已清空。';updateRounds();input.focus();};welcome();updateRounds();
</script><script src="/motion.js"></script></body></html>
